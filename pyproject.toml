[build-system]
requires = ["setuptools==80.10.2", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mojit"
version = "1.0.0"
description = "Animated Unicode compositions rendered inside WezTerm"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/mojit/_native/licenses/*",
]
dependencies = [
    "budoux==0.9.0",
    "numpy==2.4.6",
    "Pillow==12.3.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
mojit = "mojit.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mojit = [
    "_native/manifest.toml",
    "_native/win_amd64/*.dll",
    "_native/licenses/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "typography_reference: requires the recorded Windows CJK font and Raqm/FriBiDi",
    "wezterm_live: requires an interactive disposable WezTerm pane",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"spikes/**/*.py" = ["BLE001", "S110"]
