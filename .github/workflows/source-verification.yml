name: Source verification

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
      - name: Install verification environment
        run: >-
          python -m pip install
          -e ".[dev]"
          build
          "setuptools==80.10.2"
          "wheel==0.48.0"
      - name: Run source verification
        shell: pwsh
        run: ./tools/verify.ps1 -Python python
